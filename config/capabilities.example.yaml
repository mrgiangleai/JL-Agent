schema_version: 1
capabilities:
  - id: core.hermes.agent
    name: Hermes Agent Core
    version: 0.21.2
    source:
      kind: git-submodule
      repository: https://github.com/NousResearch/hermes-agent.git
      revision: 044a77b3b6af4ce16138d42762f812a20b9f7a89
    enabled: true
    health:
      state: unknown
      check: process
      timeout_seconds: 10
    permissions:
      - local.read
      - local.write.reversible
    dependencies:
      - python>=3.11,<3.14
    entrypoint:
      kind: executable
      command: .venv/bin/hermes
    capability_type: agent-core
    configuration_requirements:
      required: []
      optional:
        - provider
        - model
