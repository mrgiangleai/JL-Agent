[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jl-agent-control"
version = "0.1.0"
description = "JL Agent control-layer contracts above Hermes Agent"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
jl-agent-runtime = "jl_agent.runtime_service:main"

[project.optional-dependencies]
dev = ["ruff==0.15.10", "ty==0.0.21"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src", "tests"]
